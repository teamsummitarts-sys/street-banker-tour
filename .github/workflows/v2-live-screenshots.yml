name: V2 Live Screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-live-screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser capture tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Capture deployed V2
        env:
          V2_URL: https://street-banker-v2-workflows.onrender.com/
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const desktopPage = await desktop.newPage();
            await desktopPage.goto(process.env.V2_URL, { waitUntil: 'networkidle', timeout: 120000 });
            await desktopPage.screenshot({ path: 'screenshots/v2-desktop.png', fullPage: true });
            await desktop.close();

            const iphone = devices['iPhone 14 Pro'];
            const mobile = await browser.newContext({ ...iphone });
            const mobilePage = await mobile.newPage();
            await mobilePage.goto(process.env.V2_URL, { waitUntil: 'networkidle', timeout: 120000 });
            await mobilePage.screenshot({ path: 'screenshots/v2-mobile.png', fullPage: true });
            await mobile.close();
            await browser.close();
          })();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v2-live-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 1
