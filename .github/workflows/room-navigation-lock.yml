name: Room Navigation Lock

on:
  push:
    paths:
      - .github/workflows/room-navigation-lock.yml

permissions:
  contents: write

jobs:
  lock-room-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Room navigation patch
        shell: bash
        run: |
          echo ' ' | tr -d ' ' | base64 -d > /tmp/room-nav-patch.py
          python /tmp/room-nav-patch.py
      - name: Commit locked Room navigation
        shell: bash
        run: |
          git config user.name "street-banker-nav-lock"
          git config user.email "actions@users.noreply.github.com"
          git add song_builder/templates/song_builder/index.html song_builder/templates/song_builder/analyze.html song_builder/templates/song_builder/workflow.html docs/song-builder/PRESERVATION-20260909-NAV-LOCK.md
          git commit -m "Lock Room navigation and preservation checkpoint [room-nav-lock]"
          git push origin HEAD:main
