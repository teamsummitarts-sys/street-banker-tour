name: The Room verification

on:
  pull_request:
    paths:
      - "song_builder/**"
      - "tests/test_song_builder*.py"
      - "tests/test_room_workflow.py"
      - "tests/test_room_live.py"
      - "tests/test_room_listening.py"
      - "tests/test_room_collaboration.py"
      - "tests/test_room_phase1_design.py"
      - "tests/song_builder/**"
      - ".github/workflows/song-builder-check.yml"

jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Install Room browser test dependency
        run: npm install --no-save jsdom@latest
      - name: Song backend boundaries
        run: pytest -q tests/test_song_builder_backend.py
      - name: Portable host integration
        run: pytest -q tests/test_song_builder_host.py
      - name: V2 host diagnostic
        continue-on-error: true
        run: pytest -q tests/test_song_builder_v2.py
      - name: Demo audio diagnostic
        continue-on-error: true
        run: pytest -q tests/test_song_builder_demo.py
      - name: Pro workflow persistence and protection
        run: pytest -q tests/test_room_workflow.py
      - name: Shared Room permissions and concurrent editing
        run: pytest -q tests/test_room_collaboration.py tests/test_room_live.py tests/test_room_listening.py
      - name: Phase 1 presentation routing
        run: pytest -q tests/test_room_phase1_design.py
      - name: Browser core modules
        run: node --test tests/song_builder/*.test.mjs
      - name: Editor controller syntax
        run: node --check song_builder/static/ui/controller.mjs
      - name: Pro workflow syntax
        run: node --check song_builder/static/ui/workflow.mjs
