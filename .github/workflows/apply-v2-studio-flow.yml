name: Apply V2 Studio Flow
on:
  push:
    paths:
      - scripts/v2_studio_flow.py
      - .github/workflows/apply-v2-studio-flow.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Studio UX patch
        run: python scripts/v2_studio_flow.py
      - name: Commit generated files and remove bootstrap
        run: |
          rm -f scripts/v2_studio_flow.py .github/workflows/apply-v2-studio-flow.yml
          git config user.name "street-banker-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Connect Studio assets into one production workflow" || exit 0
          git push origin main
