name: Room Drawer Navigation
on:
  push:
    paths:
      - .github/workflows/room-drawer-nav.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Room headers with drawer navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'song_builder/templates/song_builder/index.html': {
              'old': '''  <header class="site-bar">
    <a class="brand" href="{{ builder_base_url }}/" aria-label="The Room projects"><span class="room-brand-crop"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker"></span></a>
    <nav aria-label="The Room tools" style="display:flex;align-items:center;justify-content:flex-end;gap:.45rem;flex:1;flex-wrap:wrap">
      <a class="back-link" href="{{ builder_base_url }}/">Studio</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#sound-dna">Sound DNA</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#improve-track">Improve My Track</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#reports-heading">Tempo &amp; Key Lab</a>
      <a class="back-link" href="{{ builder_base_url }}/workflow">Pro Workflow</a>
      <a class="back-link" href="#session-team">Collaborate + Listen</a>
    </nav>
    <a class="back-link" href="{{ return_url }}">Noise Lab</a>
  </header>''',
              'new': '''  <header class="site-bar room-app-header">
    <a class="brand" href="{{ builder_base_url }}/" aria-label="The Room projects"><span class="room-brand-crop"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker"></span></a>
    <details class="room-nav-drawer">
      <summary aria-label="Open The Room navigation"><span>Menu</span></summary>
      <nav aria-label="The Room navigation">
        <a href="{{ builder_base_url }}/">Studio</a>
        <a href="{{ builder_base_url }}/analyze#sound-dna">Sound DNA</a>
        <a href="{{ builder_base_url }}/analyze#improve-track">Improve My Track</a>
        <a href="{{ builder_base_url }}/analyze#reports-heading">Tempo &amp; Key Lab</a>
        <a href="{{ builder_base_url }}/workflow">Pro Workflow</a>
        <a href="#session-team">Collaborate + Listen</a>
        <div class="room-nav-divider"></div>
        <a href="/noise-lab/">Noise Lab</a>
        <a href="/reach/">Reach</a>
      </nav>
    </details>
  </header>'''
            },
            'song_builder/templates/song_builder/analyze.html': {
              'old': '''<header class="site-bar">
  <a href="{{ builder_base_url }}/" class="wordmark"><span class="room-brand-crop"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker" width="1536" height="1024"></span></a>
  <span class="header-title">Analyze &amp; Improve</span>
  <nav aria-label="The Room tools" style="display:flex;align-items:center;justify-content:flex-end;gap:.45rem;flex:1;flex-wrap:wrap">
    <a href="{{ builder_base_url }}/" class="editor-link">Studio</a>
    <a href="{{ builder_base_url }}/analyze#sound-dna" class="editor-link">Sound DNA</a>
    <a href="{{ builder_base_url }}/analyze#improve-track" class="editor-link">Improve My Track</a>
    <a href="{{ builder_base_url }}/analyze#reports-heading" class="editor-link">Tempo &amp; Key Lab</a>
    <a href="{{ builder_base_url }}/workflow" class="editor-link">Pro Workflow</a>
    <a href="{{ builder_base_url }}/#session-team" class="editor-link">Collaborate + Listen</a>
  </nav>
</header>''',
              'new': '''<header class="site-bar room-app-header">
  <a href="{{ builder_base_url }}/" class="wordmark"><span class="room-brand-crop"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker" width="1536" height="1024"></span></a>
  <span class="header-title">Analyze &amp; Improve</span>
  <details class="room-nav-drawer">
    <summary aria-label="Open The Room navigation"><span>Menu</span></summary>
    <nav aria-label="The Room navigation">
      <a href="{{ builder_base_url }}/">Studio</a>
      <a href="{{ builder_base_url }}/analyze#sound-dna">Sound DNA</a>
      <a href="{{ builder_base_url }}/analyze#improve-track">Improve My Track</a>
      <a href="{{ builder_base_url }}/analyze#reports-heading">Tempo &amp; Key Lab</a>
      <a href="{{ builder_base_url }}/workflow">Pro Workflow</a>
      <a href="{{ builder_base_url }}/#session-team">Collaborate + Listen</a>
      <div class="room-nav-divider"></div>
      <a href="/noise-lab/">Noise Lab</a>
      <a href="/reach/">Reach</a>
    </nav>
  </details>
</header>'''
            },
            'song_builder/templates/song_builder/workflow.html': {
              'old': '''  <header class="topbar">
    <div>
      <a class="workflow-brand" href="{{ builder_base_url }}/"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker"></a>
      <h1>Pro Workflow</h1>
    </div>
    <nav aria-label="The Room tools" style="display:flex;align-items:center;justify-content:flex-end;gap:.45rem;flex-wrap:wrap">
      <a class="back-link" href="{{ builder_base_url }}/">Studio</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#sound-dna">Sound DNA</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#improve-track">Improve My Track</a>
      <a class="back-link" href="{{ builder_base_url }}/analyze#reports-heading">Tempo &amp; Key Lab</a>
      <a class="back-link" href="{{ builder_base_url }}/workflow">Pro Workflow</a>
      <a class="back-link" href="{{ builder_base_url }}/#session-team">Collaborate + Listen</a>
    </nav>
  </header>''',
              'new': '''  <header class="topbar room-app-header">
    <div>
      <a class="workflow-brand" href="{{ builder_base_url }}/"><img src="{{ builder_assets_url }}ui/images/the-room-approved.png" alt="The Room by Street Banker"></a>
      <h1>Pro Workflow</h1>
    </div>
    <details class="room-nav-drawer">
      <summary aria-label="Open The Room navigation"><span>Menu</span></summary>
      <nav aria-label="The Room navigation">
        <a href="{{ builder_base_url }}/">Studio</a>
        <a href="{{ builder_base_url }}/analyze#sound-dna">Sound DNA</a>
        <a href="{{ builder_base_url }}/analyze#improve-track">Improve My Track</a>
        <a href="{{ builder_base_url }}/analyze#reports-heading">Tempo &amp; Key Lab</a>
        <a href="{{ builder_base_url }}/workflow">Pro Workflow</a>
        <a href="{{ builder_base_url }}/#session-team">Collaborate + Listen</a>
        <div class="room-nav-divider"></div>
        <a href="/noise-lab/">Noise Lab</a>
        <a href="/reach/">Reach</a>
      </nav>
    </details>
  </header>'''
            }
          }

          for path, blocks in files.items():
              p = Path(path)
              text = p.read_text()
              if blocks['old'] not in text:
                  raise SystemExit(f'Expected current Room nav block not found in {path}')
              p.write_text(text.replace(blocks['old'], blocks['new'], 1))

          css = Path('song_builder/static/ui/room-navigation.css')
          css.write_text('''/* Shared Room application drawer navigation. Navigation only; no product layout changes. */
.room-app-header{position:relative;z-index:60;}
.room-nav-drawer{position:relative;margin-left:auto;flex:0 0 auto;}
.room-nav-drawer>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:44px;padding:8px 12px;border:1px solid #5d6260;border-radius:6px;background:linear-gradient(180deg,#3a4042,#1e2325);color:#eee9df;font:600 12px/1 sans-serif;box-shadow:inset 0 1px #ffffff24,0 2px 5px #0008;}
.room-nav-drawer>summary::-webkit-details-marker{display:none;}
.room-nav-drawer>summary::before{content:'☰';font-size:20px;line-height:1;}
.room-nav-drawer[open]>summary::before{content:'×';font-size:24px;}
.room-nav-drawer nav{position:absolute;top:calc(100% + 10px);right:0;width:min(320px,calc(100vw - 24px));padding:10px;background:linear-gradient(150deg,#262c2e,#111617);border:1px solid #686d69;border-radius:9px;box-shadow:0 18px 34px #000d,inset 0 1px #ffffff1c;display:grid;gap:4px;z-index:100;}
.room-nav-drawer nav a{display:flex;align-items:center;min-height:44px;padding:10px 12px;border-radius:6px;color:#eee9df;text-decoration:none;font:600 13px/1.25 sans-serif;border:1px solid transparent;}
.room-nav-drawer nav a:hover,.room-nav-drawer nav a:focus-visible{background:#ffffff0c;border-color:#8b7650;color:#f3d495;outline:none;}
.room-nav-divider{height:1px;margin:5px 4px;background:#7a7e7752;}
@media(max-width:800px){
  .room-app-header{min-height:64px!important;height:auto!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;padding:8px 10px!important;}
  .room-app-header .brand,.room-app-header .wordmark,.room-app-header .workflow-brand{flex:0 1 auto!important;min-width:0!important;}
  .room-app-header .header-title{display:none!important;}
  .room-nav-drawer>summary span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
  .room-nav-drawer>summary{min-width:48px;width:48px;padding:7px;}
  .room-nav-drawer nav{position:fixed;top:max(76px,calc(env(safe-area-inset-top) + 58px));right:10px;left:10px;width:auto;max-height:calc(100vh - 100px - env(safe-area-inset-bottom));overflow:auto;}
}
''')

          # Add shared stylesheet to all Room surfaces.
          targets = [
            ('song_builder/templates/song_builder/index.html', '<link rel="stylesheet" href="{{ builder_assets_url }}ui/collaboration.css">'),
            ('song_builder/templates/song_builder/analyze.html', '<link rel="stylesheet" href="{{ builder_assets_url }}ui/collaboration.css">'),
            ('song_builder/templates/song_builder/workflow.html', '<link rel="stylesheet" href="{{ builder_assets_url }}ui/workflow.css?v=1">'),
          ]
          for path, marker in targets:
              p=Path(path); text=p.read_text()
              link='<link rel="stylesheet" href="{{ builder_assets_url }}ui/room-navigation.css?v=1">'
              if link not in text:
                  if marker not in text: raise SystemExit(f'Stylesheet marker missing in {path}')
                  text=text.replace(marker, marker+'\n  '+link, 1)
                  p.write_text(text)

          for path in files:
              text=Path(path).read_text()
              for token in ['Sound DNA','Improve My Track','Tempo &amp; Key Lab','Pro Workflow','Collaborate + Listen','/noise-lab/','/reach/','room-nav-drawer']:
                  if token not in text: raise SystemExit(f'{path} missing {token}')
          PY
      - name: Commit drawer navigation
        run: |
          git config user.name "street-banker-nav-lock"
          git config user.email "actions@users.noreply.github.com"
          git add song_builder/templates/song_builder/index.html song_builder/templates/song_builder/analyze.html song_builder/templates/song_builder/workflow.html song_builder/static/ui/room-navigation.css
          git commit -m "Fix Room header with complete drawer navigation [room-drawer]"
          git push origin HEAD:main
