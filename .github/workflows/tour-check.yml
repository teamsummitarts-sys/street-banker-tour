name: TOUR checks

on:
  pull_request:
    paths:
      - "tour_*.py"
      - "touring.py"
      - "templates/tour/**"
      - "static/css/tour*.css"
      - "tests/test_tour_*.py"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/tour-check.yml"
  push:
    branches:
      - main
      - tour-standalone-v2
    paths:
      - "tour_*.py"
      - "touring.py"
      - "templates/tour/**"
      - "static/css/tour*.css"
      - "tests/test_tour_*.py"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/tour-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      DATABASE_PATH: /tmp/streetbanker-v2-tour-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tour_config.py tour_engine.py tour_os.py tour_seed.py tour_store.py touring.py tour_preview.py
      - run: python -m pytest -q tests/test_tour_*.py
      - name: Verify the deployed no-login preview
        if: ${{ always() && github.ref == 'refs/heads/tour-standalone-v2' }}
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import http.cookiejar
          import time
          import urllib.parse
          import urllib.request

          base = 'https://street-banker-tour-open-preview.onrender.com'
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

          last_error = None
          for attempt in range(12):
              try:
                  with opener.open(base + '/', timeout=20) as response:
                      html = response.read().decode('utf-8')
                      assert response.status == 200
                      assert response.headers.get('X-TOUR-Preview-Revision') == 'launcher-direct-v3'
                      assert 'tour-app-body' in html
                      assert 'Start a tour' in html
                      assert 'Add a one-off show' in html
                      assert '/login' not in response.url
                      assert 'Sign out' not in html
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise RuntimeError('Live TOUR launcher failed: ' + str(last_error))

          for path in ('/', '/tours', '/tours/'):
              with opener.open(base + path, timeout=20) as response:
                  html = response.read().decode('utf-8')
                  assert response.status == 200
                  assert 'Start a tour' in html
                  assert 'Add a one-off show' in html
                  print('PASS launcher', path, 'HTTP', response.status)

          payload = urllib.parse.urlencode({
              'date': '2026-10-15',
              'venue': 'Preview Hall',
              'city': 'Nashville, TN',
              'artist_name': 'Preview Artist',
              'home_tz': 'America/New_York',
              'currency': 'USD',
          }).encode()
          req = urllib.request.Request(base + '/tour-share/preview/one-off', data=payload, method='POST')
          with opener.open(req, timeout=20) as response:
              html = response.read().decode('utf-8')
              assert response.status == 200
              assert '/shows/' in response.url
              assert 'Show Command' in html
              assert 'Additional show tools' in html
              show_url = response.url
              print('PASS one-off show HTTP', response.status)

          tour_home = show_url.split('/shows/', 1)[0]
          for suffix in ('', '/calendar', '/shows', '/people', '/money'):
              with opener.open(tour_home + suffix, timeout=20) as response:
                  assert response.status == 200
                  assert 'tour-app-body' in response.read().decode('utf-8')
                  print('PASS workspace', suffix or '/home', 'HTTP', response.status)

          print('LIVE TOUR VERIFIED: launcher, one-off creation, show command and progressive workspaces')
          PY
