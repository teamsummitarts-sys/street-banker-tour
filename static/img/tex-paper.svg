<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Press-sheet grain. Tiles at 240px on the EPK's ivory stock so the
       page reads as printed matter rather than a white div. Deliberately
       faint: at 3.5% it is felt at reading distance and invisible in a
       screenshot, which is the correct amount of texture for a document
       somebody may actually print. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#141210" filter="url(#grain)"/>
</svg>
