<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- Fan club hero: a venue marquee. Bulbs along a brass rail, the house
       dark behind it. A club is a door you are being let through, so the
       motif is the sign over the door rather than another gradient. -->
  <defs>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16130e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eecd7c"/>
      <stop offset="55%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#7a5c17"/>
    </linearGradient>
    <radialGradient id="bulb" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="55%" stop-color="#e8c667"/>
      <stop offset="100%" stop-color="#a37c2a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c667" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8c667" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="220" fill="url(#house)"/>

  <!-- light thrown up the back wall -->
  <ellipse cx="400" cy="150" rx="330" ry="90" fill="url(#glow)"/>

  <!-- marquee rail -->
  <rect x="60" y="120" width="680" height="7" rx="3.5" fill="url(#rail)"/>
  <rect x="60" y="127" width="680" height="2" fill="#0a0a0b" opacity="0.5"/>

  <!-- bulbs, evenly spaced along the rail -->
  <g>
    <circle cx="92"  cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="173" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="254" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="335" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="416" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="497" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="578" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="659" cy="112" r="7" fill="url(#bulb)"/>
    <circle cx="740" cy="112" r="7" fill="url(#bulb)"/>
  </g>

  <!-- hanging brackets -->
  <g stroke="#7a5c17" stroke-width="2" opacity="0.8">
    <path d="M140 120 L140 96"/>
    <path d="M400 120 L400 88"/>
    <path d="M660 120 L660 96"/>
  </g>

  <!-- floor line -->
  <rect x="0" y="196" width="800" height="1" fill="#c9a24a" opacity="0.25"/>
</svg>
