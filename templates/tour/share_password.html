{% extends "tour/_public.html" %}
{% block title %}Protected · Street Banker{% endblock %}
{% block body %}
<div class="to-panel is-warm" style="max-width:420px">
  <div class="to-eyebrow">{{ tour['name'] }}</div>
  <h2 class="to-h1" style="font-size:18px">This page has a password</h2>
  {% if wrong %}<div class="to-note to-note--warn" style="margin-top:10px"><strong>That password did not match.</strong></div>{% endif %}
  <form method="post" action="/tour-share/{{ token }}" style="margin-top:10px">
    <label class="to-field"><span>Password</span><input type="password" name="password" autofocus required></label>
    <div class="to-bar" style="margin-bottom:0"><button class="to-btn" type="submit">Open</button></div>
  </form>
</div>
{% endblock %}
