{% extends "partner/_shell.html" %}
{% block partner_body %}
<section class="rounded-xl border border-sb-line bg-sb-surface-1 p-5">
  <h2 class="mb-3 font-mono text-xs uppercase tracking-[0.16em] text-sb-gold">Roster</h2>
  {% if roster %}
    <ul class="space-y-2">
      {% for a in roster %}
        <li class="flex flex-wrap items-baseline gap-x-3 gap-y-1 rounded-lg border border-sb-line bg-black/20 px-3 py-2">
          <span class="text-sm font-semibold text-sb-ink">{{ a.name }}</span>
          <span class="font-mono text-xs text-sb-ink-3">{{ a.email }}</span>
          <span class="ml-auto font-mono text-xs text-sb-ink-2">{{ a.plan }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-sm text-sb-ink-2">Nobody on the roster yet.</p>
  {% endif %}
</section>
{% endblock %}
