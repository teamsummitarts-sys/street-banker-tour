<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in through Street Banker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0C0D; color: #F2EFE9; font-family: Archivo, system-ui, sans-serif; }
    main { max-width: 34rem; padding: 2rem; border: 1px solid rgba(242,239,233,0.12); border-radius: 14px; background: #101214; }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: #C9C5BC; line-height: 1.5; }
    a { display: inline-block; padding: 0.7rem 1.1rem; border-radius: 10px; background: #D4A93C; color: #1A1006; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in through Street Banker</h1>
    <p>{{ reason }}</p>
    <a href="{{ street_banker }}/login">Go to Street Banker</a>
  </main>
</body>
</html>
